[project]
name = "celus-nigiri"
version = "5.6.1"
description = "Library for downloading and parsing counter-like data."
authors = [
	{ name = "Beda Kosata", email = "beda@bigdigdata.com" },
	{ name = "Stepan Henek", email = "stepan@bigdigdata.com" },
]
requires-python = ">=3.12,<4"
license = "MIT"
classifiers = [
	"Programming Language :: Python :: 3",
	"Topic :: Software Development :: Libraries",
]
dependencies = [
	# chardet 7.x is a rewrite with a different confidence scale: e.g. Shift-JIS/CP932
	# files score ~0.2-0.34 (vs 0.99 in 5.x/6.x), so csv_detect.detect_file_encoding()'s
	# min_confidence=0.8 rejects them and falls back to utf-8 -> UnicodeDecodeError.
	# Don't bump to 7.x until encoding detection stops relying on the confidence value.
	"chardet>=5.0.0,<7",
	"ijson~=3.6.0",
	"celus-pycounter~=5.0.2",
	"python-decouple~=3.6",
	"python-dateutil~=3.0",
	"xmltodict~=1.0.4",
]

[dependency-groups]
dev = [
	"pre-commit~=4.7.0",
	"pytest~=9.1.1",
	"pytest-cov~=7.1.0",
	"pytest-responses~=0.6.0",
	"responses~=0.26.3",
	"ruff~=0.17.2",
]

[project.scripts]
nigiri-download = "celus_nigiri.download.__main__:main"
nigiri-csv = "celus_nigiri.csv_detect.__main__:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
src = ["celus_nigiri", "tests"]

[tool.ruff.lint]
fixable = ['I001'] # isort: imports are incorrectly sorted
select = [
	# Pyflakes
	"F",
	# pycodestyle
	"E",
	# isort
	"I",
]

[tool.ruff.lint.isort]
known-first-party = ["celus_nigiri"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B011"] # test files should have asserts

[tool.pytest.ini_options]
testpaths = "tests/"
